name: Auto Release on Master Merge

on:
  pull_request:
    branches:
      - master
    types: [closed]

# =============================================================
# [설정] 업데이트할 프로젝트 폴더 목록 (공백으로 구분)
# auto-version.yml의 설정과 동일하게 유지하세요.
# 예: TARGET_PROJECTS: "Business SecondProject ThirdApp"
# =============================================================
env:
  TARGET_PROJECTS: "Business"

jobs:
  create-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    # 역방향 머지를 위해 쓰기 권한이 필요합니다.
    permissions:
      contents: write
      pull-requests: read

    steps:
      # ************************************************************
      # 1. Checkout (Develop 브랜치까지 push하기 위해 전체 히스토리 필요)
      # ************************************************************
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # ************************************************************
      # 2. GitHub CLI 인증 확인
      # ************************************************************
      - name: Setup GitHub CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh auth status

      # ************************************************************
      # 3. Release 생성
      # ************************************************************
      - name: Create Releases per Project
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          # 환경 변수에서 프로젝트 목록 읽기
          IFS=' ' read -r -a PROJECTS <<< "${{ env.TARGET_PROJECTS }}"

          for PROJECT in "${PROJECTS[@]}"
          do
            echo "=================================================="
            echo "PROJECT : $PROJECT"
            echo "=================================================="

            FILE_PATH="./$PROJECT/Properties/AssemblyInfo.cs"
            if [ ! -f "$FILE_PATH" ]; then
              echo "AssemblyInfo.cs 없음 -> 스킵"
              continue
            fi

            VERSION=$(grep '\[assembly: AssemblyVersion' "$FILE_PATH" | cut -d '"' -f 2)
            if [ -z "$VERSION" ]; then
              echo "버전 추출 실패 -> 스킵"
              continue
            fi

            TAG="${PROJECT}-v${VERSION}"
            RELEASE_NOTE_FILE="./$PROJECT/ReleaseNote.txt"

            # 이미 태그 존재 시 스킵
            if git tag | grep -q "^${TAG}$"; then
              echo "이미 존재하는 태그($TAG) -> 스킵"
              continue
            fi

            NOTES="릴리즈 노트 없음"
            if [ -f "$RELEASE_NOTE_FILE" ]; then
              # AWK를 이용한 릴리즈 노트 추출 로직
              NOTES=$(awk -v VERSION="$VERSION" '
                BEGIN { found = 0 }
                {
                  sub(/^\xef\xbb\xbf/, "") # BOM 제거
                  gsub(/\r/, "")           # CR 제거
                  sub(/[ \t]+$/, "")       # 끝 공백 제거
                }
                $0 ~ "^\\[v" VERSION "\\]$" { found = 1; next }
                found && /^\*{10,}$/ { exit }
                found { print }
              ' "$RELEASE_NOTE_FILE")

              NOTES=$(echo "$NOTES" | sed '/^[[:space:]]*$/d')
              [ -z "$NOTES" ] && NOTES="릴리즈 노트 없음"
            fi

            # GitHub Release 생성
            gh release create "$TAG" \
              --title "[$PROJECT] Release v${VERSION}" \
              --notes "$NOTES" \
              --latest=false
            
            echo "[$PROJECT] 릴리즈 생성 완료: $TAG"
          done

      # ************************************************************
      # 4. 역방향 머지 (Master -> Develop)
      # 릴리즈 후 master의 변경사항(머지 커밋 등)을 Develop에 반영
      # ************************************************************
      - name: Merge Master back to Develop
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          
          echo "Merging master into Develop to keep them in sync..."
          git checkout Develop
          git pull origin Develop
          
          # master 내용을 Develop에 머지 (충돌 시 master 우선 혹은 자동 머지 시도)
          if git merge origin/master --no-edit; then
            git push origin Develop
            echo "Successfully merged master into Develop."
          else
            echo "Merge conflict detected during back-merge. Please resolve manually."
            exit 1
          fi
