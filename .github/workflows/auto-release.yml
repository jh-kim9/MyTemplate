name: Auto Release on Master Merge

on:
  pull_request:
    branches:
      - master
    types: [closed]

jobs:
  create-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Create Releases per Project
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |

          # ************************************************************
          # 프로젝트 목록 정의
          # auto-version.yml 과 동일하게 맞춰야 함
          # ************************************************************
          PROJECTS=(
            "ALT.Common"
            "ALT.Common.Control"
          )

          for PROJECT in "${PROJECTS[@]}"
          do

            echo "=================================================="
            echo "PROJECT : $PROJECT"
            echo "=================================================="

            FILE_PATH="./$PROJECT/Properties/AssemblyInfo.cs"

            if [ ! -f "$FILE_PATH" ]; then
              echo "AssemblyInfo.cs 없음 -> 스킵"
              continue
            fi

            # ************************************************************
            # 버전 추출
            # ************************************************************
            VERSION=$(grep '\[assembly: AssemblyVersion' "$FILE_PATH" | cut -d '"' -f 2)

            if [ -z "$VERSION" ]; then
              echo "버전 추출 실패 -> 스킵"
              continue
            fi

            echo "VERSION : $VERSION"

            TAG="${PROJECT}-v${VERSION}"

            RELEASE_NOTE_FILE="./$PROJECT/ReleaseNote.txt"

            echo "TAG : $TAG"
            echo "RELEASE_NOTE_FILE : $RELEASE_NOTE_FILE"

            # ************************************************************
            # 이미 태그 존재 시 스킵
            # ************************************************************
            if git tag | grep -q "^${TAG}$"; then
              echo "이미 존재하는 태그 -> 스킵"
              continue
            fi

            # ************************************************************
            # Release Note 기본값
            # ************************************************************
            NOTES="릴리즈 노트 없음"

            # ************************************************************
            # ReleaseNote.txt 존재 확인
            # ************************************************************
            if [ -f "$RELEASE_NOTE_FILE" ]; then

              echo "ReleaseNote.txt 발견"

              NOTES=$(awk -v VERSION="$VERSION" '

                BEGIN {
                  found = 0
                }

                {
                  # CR 제거 (Windows CRLF 대응)
                  gsub(/\r/, "")

                  # 줄 끝 공백 제거
                  sub(/[ \t]+$/, "")
                }

                # --------------------------------------------------------
                # 버전 시작 찾기
                #
                # 허용:
                # [v1.1.0.0]
                # [v1.1.0.0]     
                # --------------------------------------------------------
                $0 == "[v" VERSION "]" {
                  found = 1
                  next
                }

                # --------------------------------------------------------
                # 구분선 만나면 종료
                #
                # 허용:
                # **********
                # ******************************
                # --------------------------------------------------------
                found && /^\*{10,}$/ {
                  exit
                }

                # --------------------------------------------------------
                # 내용 저장
                # --------------------------------------------------------
                found {
                  print
                }

              ' "$RELEASE_NOTE_FILE")

              # 빈 줄 제거
              NOTES=$(echo "$NOTES" | sed "/^[[:space:]]*$/d")

              # 결과 없으면 기본값
              if [ -z "$NOTES" ]; then
                NOTES="릴리즈 노트 없음"
              fi

            else
              echo "ReleaseNote.txt 없음"
            fi

            echo "=================================================="
            echo "RELEASE NOTES"
            echo "=================================================="
            echo "$NOTES"

            # ************************************************************
            # GitHub Release 생성
            # ************************************************************
            gh release create "$TAG" \
              --title "[$PROJECT] Release v${VERSION}" \
              --notes "$NOTES" \
              --latest=false

            echo "릴리즈 생성 완료"

          done
