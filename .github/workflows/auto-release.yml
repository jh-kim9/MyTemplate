name: Auto Release on Master Merge

on:
  pull_request:
    branches:
      - master
    types: [closed]

jobs:
  create-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:

      # ************************************************************
      # Checkout
      # ************************************************************
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # ************************************************************
      # GitHub CLI 인증 확인
      # ************************************************************
      - name: Setup GitHub CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh auth status

      # ************************************************************
      # Release 생성
      # ************************************************************
      - name: Create Releases per Project
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |

          set -e

          # ************************************************************
          # 프로젝트 목록
          # auto-version.yml 과 동일하게 유지
          # ************************************************************
          PROJECTS=(
            "Business" "Business.Control"
          )

          # ************************************************************
          # 프로젝트 반복
          # ************************************************************
          for PROJECT in "${PROJECTS[@]}"
          do

            echo ""
            echo "=================================================="
            echo "PROJECT : $PROJECT"
            echo "=================================================="

            FILE_PATH="./$PROJECT/Properties/AssemblyInfo.cs"

            # ************************************************************
            # AssemblyInfo.cs 존재 확인
            # ************************************************************
            if [ ! -f "$FILE_PATH" ]; then
              echo "AssemblyInfo.cs 없음 -> 스킵"
              continue
            fi

            # ************************************************************
            # 버전 추출
            # ************************************************************
            VERSION=$(grep '\[assembly: AssemblyVersion' "$FILE_PATH" | cut -d '"' -f 2)

            if [ -z "$VERSION" ]; then
              echo "버전 추출 실패 -> 스킵"
              continue
            fi

            echo "VERSION : [$VERSION]"

            # ************************************************************
            # 태그명
            # ************************************************************
            TAG="${PROJECT}-v${VERSION}"

            echo "TAG : $TAG"

            # ************************************************************
            # ReleaseNote 경로
            # ************************************************************
            RELEASE_NOTE_FILE="./$PROJECT/ReleaseNote.txt"

            echo "RELEASE_NOTE_FILE : $RELEASE_NOTE_FILE"

            # ************************************************************
            # 태그 최신화
            # ************************************************************
            git fetch --tags

            # ************************************************************
            # 이미 태그 존재 시 스킵
            # ************************************************************
            if git tag | grep -q "^${TAG}$"; then
              echo "이미 존재하는 태그 -> 스킵"
              continue
            fi

            # ************************************************************
            # 기본 릴리즈 노트
            # ************************************************************
            NOTES="릴리즈 노트 없음"

            # ************************************************************
            # ReleaseNote.txt 존재 확인
            # ************************************************************
            if [ -f "$RELEASE_NOTE_FILE" ]; then

              echo ""
              echo "ReleaseNote.txt 발견"

              echo ""
              echo "=================================================="
              echo "ReleaseNote Preview"
              echo "=================================================="

              head -20 "$RELEASE_NOTE_FILE"

              echo ""
              echo "=================================================="
              echo "SEARCH TARGET"
              echo "=================================================="

              echo "[v$VERSION]"

              # ************************************************************
              # Release Note 추출
              #
              # 시작:
              # [v3.4.2.1]
              #
              # 종료:
              # **********
              #
              # 종료 구분선 없으면 파일 끝까지
              # ************************************************************
              NOTES=$(awk -v VERSION="$VERSION" '

                BEGIN {
                  found = 0
                }

                {

                  # UTF-8 BOM 제거
                  sub(/^\xef\xbb\xbf/, "")

                  # Windows CR 제거
                  gsub(/\r/, "")

                  # 줄 끝 공백 제거
                  sub(/[ \t]+$/, "")

                }

                # --------------------------------------------------------
                # 버전 시작 찾기
                # --------------------------------------------------------
                $0 ~ "^\\[v" VERSION "\\]$" {

                  found = 1
                  next
                }

                # --------------------------------------------------------
                # 구분선 만나면 종료
                # --------------------------------------------------------
                found && /^\*{10,}$/ {

                  exit
                }

                # --------------------------------------------------------
                # 내용 저장
                # --------------------------------------------------------
                found {

                  print
                }

              ' "$RELEASE_NOTE_FILE")

              # ************************************************************
              # 빈 줄 제거
              # ************************************************************
              NOTES=$(echo "$NOTES" | sed '/^[[:space:]]*$/d')

              # ************************************************************
              # 결과 없으면 기본값
              # ************************************************************
              if [ -z "$NOTES" ]; then
                NOTES="릴리즈 노트 없음"
              fi

            else

              echo "ReleaseNote.txt 없음"

            fi

            # ************************************************************
            # Release Notes 출력
            # ************************************************************
            echo ""
            echo "=================================================="
            echo "RELEASE NOTES"
            echo "=================================================="

            echo "$NOTES"

            echo ""
            echo "=================================================="
            echo "CREATE RELEASE"
            echo "=================================================="

            # ************************************************************
            # GitHub Release 생성
            # ************************************************************
            gh release create "$TAG" \
              --title "[$PROJECT] Release v${VERSION}" \
              --notes "$NOTES" \
              --latest=false

            echo ""
            echo "릴리즈 생성 완료"

          done
