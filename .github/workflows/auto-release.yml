name: Auto Release on Master Merge

on:
  pull_request:
    branches:
      - master
    types: [closed]

jobs:
  create-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Create Releases per Project
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |

          # ************************************************************
          # 프로젝트 목록 정의
          # auto-version.yml 과 동일하게 맞춰야 함
          # ************************************************************
          PROJECTS=(
            "ALT.Controller.TDS"
            "ALT.Controller.TDS.Control"
          )

          for PROJECT in "${PROJECTS[@]}"
          do

            echo "=================================================="
            echo "PROJECT : $PROJECT"
            echo "=================================================="

            FILE_PATH="./$PROJECT/Properties/AssemblyInfo.cs"

            if [ ! -f "$FILE_PATH" ]; then
              echo "AssemblyInfo.cs 없음 -> 스킵"
              continue
            fi

            # ************************************************************
            # 버전 추출
            # ************************************************************
            VERSION=$(grep '\[assembly: AssemblyVersion' "$FILE_PATH" | cut -d '"' -f 2)

            if [ -z "$VERSION" ]; then
              echo "버전 추출 실패"
              continue
            fi

            echo "VERSION : $VERSION"

            TAG="${PROJECT}-v${VERSION}"

            RELEASE_NOTE_FILE="./$PROJECT/ReleaseNote.txt"

            echo "TAG : $TAG"
            echo "RELEASE_NOTE_FILE : $RELEASE_NOTE_FILE"

            # ************************************************************
            # 이미 태그 존재 시 스킵
            # ************************************************************
            if git tag | grep -q "^${TAG}$"; then
              echo "이미 존재하는 태그 -> 스킵"
              continue
            fi

            # ************************************************************
            # Release Note 추출
            # 형식:
            #
            # [v2.5.0.0]
            # 26.05.13
            #   - 내용
            # ============================
            #
            # ************************************************************
            NOTES="릴리즈 노트 없음"

            if [ -f "$RELEASE_NOTE_FILE" ]; then

              NOTES=$(awk -v ver="[v${VERSION}]" '

                BEGIN {
                  found=0
                }

                {
                  # CRLF 대응
                  gsub(/\r/, "")
                }

                # 버전 찾기
                $0 == ver {
                  found=1
                  next
                }

                # 구분선 만나면 종료
                found && /^=+$/ {
                  exit
                }

                # 내용 저장
                found {
                  print
                }

              ' "$RELEASE_NOTE_FILE")

              # 앞뒤 빈 줄 제거
              NOTES=$(echo "$NOTES" | sed '/^[[:space:]]*$/d')

              if [ -z "$NOTES" ]; then
                NOTES="릴리즈 노트 없음"
              fi

            else
              echo "ReleaseNote.txt 없음"
            fi

            echo "=================================================="
            echo "RELEASE NOTES"
            echo "=================================================="
            echo "$NOTES"

            # ************************************************************
            # GitHub Release 생성
            # ************************************************************
            gh release create "$TAG" \
              --title "[$PROJECT] Release v${VERSION}" \
              --notes "$NOTES" \
              --latest=false

            echo "릴리즈 생성 완료"

          done
