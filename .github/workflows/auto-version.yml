name: Smart Multi-Project Version Bump

on:
  pull_request:
    branches:
      - Develop
    types: [closed]

jobs:
  bump-version:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # 히스토리 전체를 가져와야 변경된 파일을 찾을 수 있음

      - name: Detect Changed Projects and Update
        run: |
          # 1. 이번 머지에서 변경된 파일 목록 가져오기
          CHANGED_FILES=$(git diff --name-only HEAD^ HEAD)
          
          # *****************2. 업데이트할 프로젝트 목록 정의 (프로젝트 목록과 정확히 일치해야합니다!!!!!)**************************
          PROJECTS=("ALT.Controller.Base" "ALT.Controller.Base.Control")
          
          # 2. PR 제목에서 버전업 자릿수 키워드 추출
          MSG="${{ github.event.pull_request.title }}"
          
          # 버전 변경 내역 누적 변수
          VERSION_LOG=""
          
          for PROJECT in "${PROJECTS[@]}"; do
            # 해당 프로젝트 폴더 내에 변경사항이 있는지 확인
            if echo "$CHANGED_FILES" | grep -q "^$PROJECT/"; then
              echo "Detect change in $PROJECT. Bumping version..."
              
              FILE_PATH="./$PROJECT/Properties/AssemblyInfo.cs"
              if [ ! -f "$FILE_PATH" ]; then continue; fi

              # 기존 버전 추출
              OLD_VERSION=$(grep '\[assembly: AssemblyVersion' "$FILE_PATH" | cut -d '"' -f 2)
              IFS='.' read -r -a V <<< "$OLD_VERSION"

              # 버전 계산
              if [[ "$MSG" == *"#major"* ]]; then
                V[0]=$((V[0] + 1)); V[1]=0; V[2]=0; V[3]=0
              elif [[ "$MSG" == *"#minor"* ]]; then
                V[1]=$((V[1] + 1)); V[2]=0; V[3]=0
              elif [[ "$MSG" == *"#build"* ]]; then
                V[2]=$((V[2] + 1)); V[3]=0
              else
                V[3]=$((V[3] + 1))
              fi

              NEW_VERSION="${V[0]}.${V[1]}.${V[2]}.${V[3]}"
              
              # 파일 수정
              sed -i "s/AssemblyVersion(\"$OLD_VERSION\")/AssemblyVersion(\"$NEW_VERSION\")/g" "$FILE_PATH"
              sed -i "s/AssemblyFileVersion(\"$OLD_VERSION\")/AssemblyFileVersion(\"$NEW_VERSION\")/g" "$FILE_PATH"
              
              git add "$FILE_PATH"
              echo "Updated $PROJECT to $NEW_VERSION"
              
              # 변경 내역 누적
              VERSION_LOG="$VERSION_LOG\n- $PROJECT: $OLD_VERSION → $NEW_VERSION"
            fi
          done
          
          # 다음 step에서 사용할 수 있도록 환경변수로 저장
          echo "VERSION_LOG<<EOF" >> $GITHUB_ENV
          echo -e "$VERSION_LOG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          # 변경사항이 있을 때만 커밋
          if ! git diff --staged --quiet; then
            git commit -m "[chore] Auto-bump versions${{ env.VERSION_LOG }}"
            git push
          else
            echo "No version changes to commit."
          fi
          
